; PlatformIO para el proyecto STM32CubeIDE/CubeMX (STM32F411CEU6 - Black Pill)
; Compila directamente Core/ y Drivers/ generados por CubeMX, sin framework de PlatformIO.

[platformio]
src_dir = .
include_dir = Core/Inc

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
board_build.ldscript = STM32F411CEUX_FLASH.ld
; El .ld de CubeIDE usa READONLY (requiere GCC >= 11)
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0

build_src_filter =
    -<*>
    +<Core/Src/>
    +<Core/Startup/>
    +<Drivers/STM32F4xx_HAL_Driver/Src/>
    -<Drivers/STM32F4xx_HAL_Driver/Src/*_template.c>

build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F411xE
    -DDEBUG
    -ICore/Inc
    -IDrivers/STM32F4xx_HAL_Driver/Inc
    -IDrivers/STM32F4xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32F4xx/Include
    -IDrivers/CMSIS/Include
    -Os
    -g3

extra_scripts = pre:fpu_flags.py

upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
