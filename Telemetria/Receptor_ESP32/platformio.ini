; Receptor LoRa de telemetría (SX1278) -> USB serial -> OBC/puente/puente.py
;
; Hay dos receptores con el mismo firmware; cambian pines y LEDs:
;   pio run -e xiao   -t upload   ; XIAO ESP32S3 Sense (pines detectados en la placa real)
;   pio run -e devkit -t upload   ; ESP32 DevKit V1 30 pines (Esquema_Receptor.png)
;
; Pruebas en la PC (sin placa):  pio test -e native
;
; LEDs: PIN_LED_OK destella con paquete válido, PIN_LED_MAL con paquete descartado,
; PIN_LED_ERROR queda fijo si la radio no arranca. -1 = no hay LED.

[platformio]
default_envs = xiao

[radio]
lib_deps = jgromes/RadioLib@^7.1.2

[env:xiao]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps = ${radio.lib_deps}
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DPIN_SCK=7     ; D8
	-DPIN_MISO=8    ; D9
	-DPIN_MOSI=9    ; D10
	-DPIN_NSS=43    ; D6
	-DPIN_RST=6     ; D5
	-DPIN_DIO0=5    ; D4
	-DPIN_DIO1=-1   ; no está conectado
	-DPIN_LED_OK=21     ; LED naranja de la placa
	-DPIN_LED_ERROR=21
	-DPIN_LED_MAL=-1
	-DLED_ACTIVO_BAJO=1

[env:devkit]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${radio.lib_deps}
build_flags =
	-DPIN_SCK=18
	-DPIN_MISO=19
	-DPIN_MOSI=23
	-DPIN_NSS=5
	-DPIN_RST=14
	-DPIN_DIO0=2    ; IO0 del SX1278 por R5 (0 ohm)
	-DPIN_DIO1=-1   ; no está conectado
	-DPIN_LED_OK=27     ; azul
	-DPIN_LED_MAL=26    ; amarillo
	-DPIN_LED_ERROR=25  ; rojo
	-DLED_ACTIVO_BAJO=0

[env:native]
platform = native
test_framework = unity
